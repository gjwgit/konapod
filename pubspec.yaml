name: konapod
description: Hyundai Konapod – Vehicle Dashboard
publish_to: 'none'
version: 0.2.55+7

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  emacs_text_field: ^0.1.0
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^12.2.0
  fl_chart: ^0.70.2
  flutter_map: ^7.0.2
  flutter_secure_storage: ^10.0.0
  gap: ^3.0.1
  http: ^1.6.0
  intl: ^0.20.2
  latlong2: ^0.9.1
  markdown_tooltip: ^0.0.10
  pdf: ^3.11.1
  printing: ^5.13.1
  provider: ^6.1.5
  solidpod: ^1.0.21
  solidui: ^1.0.39
  uuid: ^4.5.3
  window_manager: ^0.5.1

# 20260911 gjw TEMPORARY. The published solidpod and solid_auth clear the
# session on every start, so the login page always appears — see
# anusii/solidpod#717 and anusii/solid_auth#53. These overrides pick up the
# fixes from the local clones, which must stay on the fix branches
# (gjw/716_single_flight_session_restore and gjw/52_secure_token_store) for
# the fixes to be present. Remove this section once both are released.

dependency_overrides:
  solid_auth:
    path: ../../anusii/solid_auth
  solidpod:
    path: ../../anusii/solidpod
  intl: ^0.20.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # 20260525 gjw macOS build on git started failing.
  config:
    enable-swift-package-manager: false
  assets:
    - assets/images/app_image.jpg
    - assets/images/app_icon.png

# Define launcher icons for all platforms (except Linux) so icons for
# the apps can be automatically updated using:
#
# `dart run flutter_launcher_icons`
#
# (gjw 20250429)

flutter_launcher_icons:
  image_path: "assets/images/app_icon.png"
  android: true
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#ffffff"
  macos:
    generate: true
  web:
    generate: true
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    icon_size: 48 # min:48, max:256, default: 48
