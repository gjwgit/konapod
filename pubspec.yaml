name: konapod
description: Hyundai Konapod – Vehicle Dashboard
publish_to: 'none'
version: 0.2.22+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  fl_chart: ^0.70.2
  gap: ^3.0.1
  http: ^1.6.0
  intl: ^0.20.2
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  markdown_tooltip: ^0.0.10
  solidpod: ^0.12.0
  solidui: ^0.3.2
  uuid: ^4.5.3

dependency_overrides:
  intl: ^0.20.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_image.jpg
    - assets/images/app_icon.png

# Define launcher icons for all platforms (except Linux) so icons for
# the apps can be automatically updated using:
#
# `dart run flutter_launcher_icons`
#
# (gjw 20250429)

flutter_launcher_icons:
  image_path: "assets/images/app_icon.png"
  android: true
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#ffffff"
  macos:
    generate: true
  web:
    generate: true
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    icon_size: 48 # min:48, max:256, default: 48
